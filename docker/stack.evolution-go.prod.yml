# Evolution GO isolada para Portainer / Docker Swarm.
# Variaveis: .env.evolution-go.prod.example. Instrucoes: README.evolution-go.md.
# Usa o PostgreSQL existente na network_public; nao cria Postgres nem Redis.
version: "3.8"

services:
  evolution-go:
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:0.7.2}
    environment:
      SERVER_PORT: "8080"
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}
      # Na 0.7.2, as tres variaveis recebem a DSN completa e sao obrigatorias.
      POSTGRES_DB: "postgresql://evogo:${EVOLUTION_GO_POSTGRES_PASSWORD}@postgres_postgres:5432/evogo?sslmode=disable"
      POSTGRES_AUTH_DB: "postgresql://evogo:${EVOLUTION_GO_POSTGRES_PASSWORD}@postgres_postgres:5432/evogo?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://evogo:${EVOLUTION_GO_POSTGRES_PASSWORD}@postgres_postgres:5432/evogo?sslmode=disable"
      WEBHOOK_FILES: "false"
      DATABASE_SAVE_MESSAGES: "false"
    networks:
      - network_public
    deploy:
      # Uma replica para evitar disputa pelas mesmas sessoes do WhatsApp.
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        window: 120s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.evogo.rule=Host(`${EVOLUTION_GO_HOST:-evogo.bjsoft.com.br}`)"
        - "traefik.http.routers.evogo.entrypoints=websecure"
        - "traefik.http.routers.evogo.tls=true"
        - "traefik.http.routers.evogo.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.evogo.service=evogo"
        - "traefik.http.services.evogo.loadbalancer.server.port=8080"
        - "traefik.http.services.evogo.loadbalancer.passhostheader=true"

networks:
  network_public:
    external: true
