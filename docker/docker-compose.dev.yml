name: plataforma-comercial-dev

services:
  deps:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile.dev
    working_dir: /app
    command: pnpm install --frozen-lockfile
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules

  db-init:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile.dev
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://plataforma:plataforma@postgres:5432/plataforma_comercial?schema=public
    command: >-
      sh -c "pnpm --filter @plataforma/contracts build &&
      pnpm --filter @plataforma/api prisma:generate &&
      pnpm --filter @plataforma/api prisma:deploy &&
      pnpm --filter @plataforma/api exec ts-node prisma/seed-base.ts"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile.dev
    working_dir: /app
    environment:
      NODE_ENV: development
      # Role de app (sem BYPASSRLS/superuser) — ver migration
      # 20260724000000_baseline. Migrations/seed (serviço db-init) continuam
      # rodando com o role "plataforma", dono das tabelas.
      DATABASE_URL: postgresql://plataforma_app:plataforma_app_dev_only@postgres:5432/plataforma_comercial?schema=public
      REDIS_URL: redis://redis:6379
      # Cifra a chave de API do provedor de IA (AES-256-GCM, 32 bytes em
      # base64). Sem ela a gravação da chave é recusada — de propósito, para
      # não guardar segredo de terceiro em claro. Em produção, gere outra:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      # Trocar esta chave invalida o que já está gravado (é preciso regravar).
      AGENTE_IA_CRYPTO_KEY: ${AGENTE_IA_CRYPTO_KEY:-ZGV2LW9ubHktbmFvLXVzZS1lbS1wcm9kdWNhby0zMmI=}
      JWT_ACCESS_SECRET: desenvolvimento-local-access
      PORTAL_JWT_ACCESS_SECRET: desenvolvimento-local-portal-access
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: desenvolvimento-local-refresh
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3002
      # Mailhog captura os e-mails localmente (não envia de verdade) — ver UI
      # web em http://localhost:8025. Sem SMTP_USER: Mailhog não exige auth.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      MAIL_FROM: "Plataforma Comercial <no-reply@plataforma.local>"
      # Segredo compartilhado com o whatsapp-worker (mesmo valor nos dois
      # serviços). Sem ele, o worker recusa subir — de propósito: quem alcança
      # o worker fala pelo WhatsApp dos vendedores.
      WHATSAPP_WORKER_TOKEN: ${WHATSAPP_WORKER_TOKEN:-desenvolvimento-local-worker}
      # Cifra os segredos do WhatsApp (chave da Evolution GO, token de cada
      # instância, segredo do webhook). 32 bytes em base64, chave própria — a
      # do agente de IA tem outro dono e outro ciclo de rotação.
      WHATSAPP_CRYPTO_KEY: ${WHATSAPP_CRYPTO_KEY:-ZGV2LW9ubHktd2hhdHNhcHAtY3J5cHRvLWtleS0zMmI=}
      # Endereço que a Evolution GO usa para chamar a API de volta. É o nome do
      # serviço na rede do compose: `localhost` aqui apontaria para dentro do
      # container do gateway, e nenhum evento chegaria.
      WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL: ${WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL:-http://api:3001}
    command: pnpm --filter @plataforma/api start:dev
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
      - api_uploads:/app/apps/api/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  # Sessões de WhatsApp. Réplica única por requisito, não por capacidade: duas
  # instâncias da mesma sessão fazem o WhatsApp derrubar uma delas.
  whatsapp-worker:
    build:
      context: ..
      dockerfile: docker/whatsapp-worker.Dockerfile.dev
    working_dir: /app
    environment:
      # Role e schema próprios do store de sessão (migration
      # 20260815024500_whatsapp_store_schema). A biblioteca roda as migrations
      # dela a cada conexão, então precisa de DDL — mas só dentro do schema
      # `whatsapp`. Este role não tem acesso nenhum às tabelas de negócio.
      DATABASE_URL: postgresql://whatsapp_store:whatsapp_store_dev_only@postgres:5432/plataforma_comercial?schema=whatsapp
      WHATSAPP_WORKER_TOKEN: ${WHATSAPP_WORKER_TOKEN:-desenvolvimento-local-worker}
      API_URL: http://api:3001
      PORT: 3100
      # `debug` mostra as falhas de decifrar addon (reação, voto de enquete),
      # que a biblioteca registra só nesse nível — em `info` o sintoma é a
      # reação sumir sem deixar rastro. Ruidoso: use só ao investigar.
      WHATSAPP_LOG_NIVEL: ${WHATSAPP_LOG_NIVEL:-info}
    command: pnpm --filter @plataforma/whatsapp-worker start:dev
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - whatsapp_worker_node_modules:/app/apps/whatsapp-worker/node_modules
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Cria o banco técnico da Evolution GO.
  #
  # Separado do `plataforma_comercial` de propósito: o gateway roda as próprias
  # migrations e guarda credenciais de sessão. Misturá-lo às tabelas de negócio
  # daria a um serviço de terceiro o mesmo banco onde vivem os dados da
  # empresa — e o RLS por empresa não protege de quem tem DDL.
  #
  # O gateway cria o banco sozinho se ele não existir, mas só quando o role da
  # DSN tem permissão para isso. Criar aqui torna o pré-requisito explícito e
  # não depende desse privilégio.
  evolution-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: plataforma
    # `|| true`: o banco já existir é o caso normal a partir da segunda subida.
    command: >-
      sh -c "psql -h postgres -U plataforma -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='evolution'\"
      | grep -q 1 || psql -h postgres -U plataforma -d postgres -c 'CREATE DATABASE evolution'"
    depends_on:
      postgres:
        condition: service_healthy

  # Gateway Evolution GO — o segundo transporte de WhatsApp.
  #
  # Ao contrário do `whatsapp-worker`, ele **não** é código deste repositório:
  # é um serviço de terceiro que mantém as sessões, o QR e a reconexão no banco
  # dele. A API fala com ele por HTTP e recebe os eventos por webhook.
  #
  # Imagem `evoapicloud/evolution-go` (Docker Hub), tag fixa mesmo em dev: o
  # contrato do webhook e os nomes de rota mudam entre versões, e um dev que
  # segue `latest` deixa de reproduzir o que roda em produção. 0.7.2 é a última
  # estável publicada (2026-07-03); as `-beta` existem e não devem ser usadas.
  evolution-go:
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:0.7.2}
    restart: unless-stopped
    environment:
      # Verificado contra a imagem 0.7.2 em 2026-08-27: **não** existe
      # `DATABASE_URL`. As três variáveis abaixo recebem a DSN inteira (o nome
      # `POSTGRES_DB` engana — o serviço a interpreta como DSN, não como nome
      # de banco), e sem `POSTGRES_AUTH_DB`/`POSTGRES_USERS_DB` o processo sobe
      # e morre em panic no auto-migration.
      POSTGRES_DB: postgresql://plataforma:plataforma@postgres:5432/evolution?sslmode=disable
      POSTGRES_AUTH_DB: postgresql://plataforma:plataforma@postgres:5432/evolution?sslmode=disable
      POSTGRES_USERS_DB: postgresql://plataforma:plataforma@postgres:5432/evolution?sslmode=disable
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      # Chave administrativa: cria, conecta e apaga instância de qualquer
      # vendedor. Em dev é fixa; em produção é gerada e guardada cifrada pela
      # tela de Administração > WhatsApp > Evolution GO.
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:-desenvolvimento-local-evolution}
      SERVER_PORT: "8080"
      # As duas mantêm o conteúdo fora do banco do gateway. Quem decide o que é
      # gravado é a API, pela regra de vínculo com cliente; ligar qualquer uma
      # criaria um segundo arquivo de conversas fora das regras de privacidade
      # e retenção da plataforma.
      WEBHOOK_FILES: "false"
      DATABASE_SAVE_MESSAGES: "false"
    ports:
      # Publicada só em dev, para inspecionar o Swagger do gateway. Em produção
      # ele fica exclusivamente na rede interna.
      - "127.0.0.1:8081:8080"
    depends_on:
      evolution-db-init:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile.dev
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    command: pnpm --filter web exec next dev -H 0.0.0.0 -p 3000
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ..:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - contracts_node_modules:/app/packages/contracts/node_modules
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma_comercial
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma_comercial"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails enviados pela API em dev, sem enviar de verdade. UI web
  # em http://localhost:8025; a API fala SMTP com ele na porta 1025.
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
  node_modules:
  api_node_modules:
  web_node_modules:
  contracts_node_modules:
  whatsapp_worker_node_modules:
  api_uploads:
