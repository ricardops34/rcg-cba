# Stack de produção/teste na VPS — imagens buildadas e publicadas manualmente
# no Docker Hub via publish.ps1 (raiz do repo). Sem bind mount: o código está
# dentro da imagem; deploy = rodar publish.ps1 + redeploy no Portainer.
#
# Os valores de DATABASE_URL/JWT_*/etc. NÃO ficam neste arquivo: são definidos
# como variáveis de ambiente do stack no Portainer (Stacks → rcgcba → Env).
version: "3.8"

services:
  api:
    image: bjsoftware/rcgcba-api:latest
    environment:
      # O JWT inclui permissões; perfis amplos precisam de mais espaço no Authorization.
      NODE_OPTIONS: "--max-http-header-size=65536"
      # Runtime: plataforma_app. Migrations do boot: a role dona, à parte.
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PORTAL_JWT_ACCESS_SECRET: ${PORTAL_JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN}
      AGENTE_IA_CRYPTO_KEY: ${AGENTE_IA_CRYPTO_KEY}
      # Cifra os segredos do WhatsApp gravados no banco: a chave da Evolution
      # GO, o token de cada instância e o segredo do webhook. Chave própria, e
      # não a do agente de IA — donos e ciclos de rotação diferentes.
      # Trocá-la exige regravar a chave pela tela e reconectar as instâncias.
      WHATSAPP_CRYPTO_KEY: ${WHATSAPP_CRYPTO_KEY}
      # Endereço com que a Evolution GO chama a API de volta.
      # Se a Evolution GO estiver externa (outra VPS / nuvem): https://api.rcgdist.com.br
      # Se estiver na mesma VPS/rede Docker: http://rcgcba-api:3001
      WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL: ${WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL:-https://api.rcgdist.com.br}
    volumes:
      # Uploads (logos de empresa) persistem fora do container.
      - uploads:/app/apps/api/uploads
    networks:
      network_public:
        aliases:
          - rcgcba-api
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.plataforma-rcg-api.rule=Host(`api.rcgdist.com.br`)"
        - "traefik.http.routers.plataforma-rcg-api.entrypoints=websecure"
        - "traefik.http.routers.plataforma-rcg-api.tls=true"
        - "traefik.http.routers.plataforma-rcg-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-rcg-api.service=plataforma-rcg-api"
        - "traefik.http.services.plataforma-rcg-api.loadbalancer.server.port=3001"


  web:
    image: bjsoftware/rcgcba-web:latest
    networks:
      network_public:
        aliases:
          - rcgcba-web
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=network_public"
        - "traefik.http.routers.plataforma-rcg-web.rule=Host(`plataforma.rcgdist.com.br`)"
        - "traefik.http.routers.plataforma-rcg-web.entrypoints=websecure"
        - "traefik.http.routers.plataforma-rcg-web.tls=true"
        - "traefik.http.routers.plataforma-rcg-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-rcg-web.service=plataforma-rcg-web"
        - "traefik.http.services.plataforma-rcg-web.loadbalancer.server.port=3000"

volumes:
  uploads:

networks:
  network_public:
    external: true
