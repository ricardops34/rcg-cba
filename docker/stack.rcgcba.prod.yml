# Stack de produção/teste na VPS — imagens buildadas e publicadas manualmente
# no Docker Hub via publish.ps1 (raiz do repo). Sem bind mount: o código está
# dentro da imagem; deploy = rodar publish.ps1 + redeploy no Portainer.
#
# Os valores de DATABASE_URL/JWT_*/etc. NÃO ficam neste arquivo: são definidos
# como variáveis de ambiente do stack no Portainer (Stacks → rcgcba → Env).
version: "3.8"

services:
  api:
    image: bjsoftware/rcgcba-api:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN}
      AGENTE_IA_CRYPTO_KEY: ${AGENTE_IA_CRYPTO_KEY}
      # Segredo compartilhado com o whatsapp-worker (mesmo valor nos dois).
      WHATSAPP_WORKER_TOKEN: ${WHATSAPP_WORKER_TOKEN}
    volumes:
      # Uploads (logos de empresa) persistem fora do container.
      - uploads:/app/apps/api/uploads
    networks:
      network_public:
        aliases:
          - rcgcba-api
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.rcgcba-api.rule=Host(`api.rcgcba.bjsoft.com.br`)"
        - "traefik.http.routers.rcgcba-api.entrypoints=websecure"
        - "traefik.http.routers.rcgcba-api.tls=true"
        - "traefik.http.routers.rcgcba-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.rcgcba-api.loadbalancer.server.port=3001"

  # Sessões de WhatsApp dos vendedores. Mesmo stack, mesma rede, mesmo deploy —
  # é um serviço à parte, não uma stack à parte.
  #
  # Por que não roda dentro da API: cada sessão é um WebSocket vivo e com
  # estado. A API reinicia a cada atualização e pode escalar em réplicas; duas
  # réplicas com a mesma sessão fazem o WhatsApp derrubar uma delas.
  #
  # **replicas: 1 não é ajuste de capacidade, é requisito.** Subir para 2
  # duplica as conexões e derruba o atendimento.
  #
  # Sem labels do Traefik de propósito: este serviço fala pelo WhatsApp dos
  # vendedores e só deve ser alcançável de dentro da rede, pela API.
  whatsapp-worker:
    image: bjsoftware/rcgcba-whatsapp-worker:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WHATSAPP_WORKER_TOKEN: ${WHATSAPP_WORKER_TOKEN}
      API_URL: http://rcgcba-api:3001
      PORT: "3100"
    networks:
      network_public:
        aliases:
          - rcgcba-whatsapp-worker
    deploy:
      replicas: 1

  web:
    image: bjsoftware/rcgcba-web:latest
    networks:
      network_public:
        aliases:
          - rcgcba-web
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.rcgcba-web.rule=Host(`rcgcba.bjsoft.com.br`)"
        - "traefik.http.routers.rcgcba-web.entrypoints=websecure"
        - "traefik.http.routers.rcgcba-web.tls=true"
        - "traefik.http.routers.rcgcba-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.rcgcba-web.loadbalancer.server.port=3000"

volumes:
  uploads:

networks:
  network_public:
    external: true
