# Stack de produção na VPS — imagens buildadas e publicadas manualmente no Docker
# Hub via publish.ps1 (raiz do repo). Sem bind mount: o código está dentro da
# imagem; deploy = rodar publish.ps1 + redeploy no Portainer.
#
# UMA STACK PARA QUALQUER CLIENTE: nada de domínio, marca ou alias está escrito
# aqui. O que muda de um cliente para outro são as variáveis do stack no
# Portainer (Stacks → <stack> → Environment variables):
#
#   WEB_HOST       domínio do sistema            ex.: crm.suaempresa.com.br
#   API_HOST       domínio da API (webhooks e    ex.: api.suaempresa.com.br
#                  integração do ERP)
#   EMPRESA_ALIAS  alias da empresa no login     ex.: suaempresa   (SÓ MINÚSCULAS: é o
#                  mesmo alias cadastrado na empresa; ver runbook, "Convenções")
#   WEB_URL        endereço do sistema nos e-mails (opcional; sem ele vale o
#                  primeiro CORS_ORIGIN)         ex.: https://crm.suaempresa.com.br
#   CORS_ORIGIN    https://<WEB_HOST>
#   API_ALIAS      (opcional) nome da API na rede interna; padrão rcgcba-api. Com mais de
#                  um stack na mesma rede, cada um precisa do seu (ex.: api-suaempresa).
#   WEB_ALIAS      (opcional) idem para o web; padrão rcgcba-web
#
# Os nomes dos roteadores/serviços do Traefik levam o EMPRESA_ALIAS: nomes iguais
# em dois stacks colidem (são globais no Traefik).
#
# Os valores de DATABASE_URL/JWT_*/etc. também NÃO ficam neste arquivo.
version: "3.8"

services:
  api:
    image: bjsoftware/rcgcba-api:latest
    environment:
      # O JWT inclui permissões; perfis amplos precisam de mais espaço no Authorization.
      NODE_OPTIONS: "--max-http-header-size=65536"
      # Runtime: plataforma_app. Migrations do boot: a role dona, à parte.
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PORTAL_JWT_ACCESS_SECRET: ${PORTAL_JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Endereço do sistema nos links dos e-mails (senha provisória, redefinir
      # senha, link do orçamento). Sem ele, vale o primeiro valor do CORS_ORIGIN.
      WEB_URL: ${WEB_URL:-}
      # Opcional. O cookie de sessão (refresh token) sai `Secure` em produção sozinho
      # (NODE_ENV=production da imagem); só defina `false` para testar em HTTP fora
      # do localhost. Vazio = padrão.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      AGENTE_IA_CRYPTO_KEY: ${AGENTE_IA_CRYPTO_KEY}
      # Cifra os segredos do WhatsApp gravados no banco: a chave da Evolution
      # GO, o token de cada instância e o segredo do webhook. Chave própria, e
      # não a do agente de IA — donos e ciclos de rotação diferentes.
      # Trocá-la exige regravar a chave pela tela e reconectar as instâncias.
      WHATSAPP_CRYPTO_KEY: ${WHATSAPP_CRYPTO_KEY}
      # Cifra os parâmetros de tipo senha (SMTP_SENHA, SMS_TOKEN). Chave
      # própria. Sem ela, salvar a senha do e-mail ou o token do SMS é
      # recusado; trocá-la exige regravar os dois pelas telas.
      PARAMETROS_CRYPTO_KEY: ${PARAMETROS_CRYPTO_KEY}
      # Endereço com que a Evolution GO chama a API de volta.
      # Padrão: o domínio da API deste stack (https://<API_HOST>).
      # Se a Evolution GO estiver na mesma VPS/rede Docker: http://rcgcba-api:3001
      WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL: ${WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL:-https://${API_HOST}}
      # Armazenamento de arquivos no MinIO (docs/planos/2026-10-13-armazenamento-arquivos-minio.md).
      # Vazias = tudo em disco, no volume uploads, como antes. As pastas listadas em
      # ARMAZENAMENTO_S3_PASTAS (ex.: whatsapp) passam a gravar no bucket; o que ainda
      # está em disco continua servido até ser copiado (Plataforma → Armazenamento).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ENDPOINT_PUBLICO: ${S3_ENDPOINT_PUBLICO:-}
      S3_REGIAO: ${S3_REGIAO:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      ARMAZENAMENTO_S3_PASTAS: ${ARMAZENAMENTO_S3_PASTAS:-}
    volumes:
      # Uploads (logos de empresa) persistem fora do container.
      - uploads:/app/apps/api/uploads
    networks:
      RCGNet:
        aliases:
          - ${API_ALIAS:-rcgcba-api}
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=RCGNet"
        # API no domínio próprio: webhooks (Evolution GO) e quem integra por ele.
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-api.rule=Host(`${API_HOST}`)"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-api.entrypoints=websecure"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-api.tls=true"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-api.service=plataforma-${EMPRESA_ALIAS}-api"
        - "traefik.http.services.plataforma-${EMPRESA_ALIAS}-api.loadbalancer.server.port=3001"
        # A API também responde no domínio do front, só em /api e /uploads: o front
        # chama `/api/v1` no mesmo endereço em que o usuário abriu o sistema, e o
        # cookie de sessão fica "da casa". `priority` explícita: o web responde ao
        # mesmo Host, e a regra com caminho precisa ganhar dele.
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web-api.rule=Host(`${WEB_HOST}`) && (PathPrefix(`/api/`) || PathPrefix(`/uploads/`))"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web-api.priority=100"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web-api.entrypoints=websecure"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web-api.tls=true"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web-api.service=plataforma-${EMPRESA_ALIAS}-api"


  web:
    image: bjsoftware/rcgcba-web:latest
    networks:
      RCGNet:
        aliases:
          - ${WEB_ALIAS:-rcgcba-web}
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=RCGNet"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web.rule=Host(`${WEB_HOST}`)"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web.entrypoints=websecure"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web.tls=true"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web.service=plataforma-${EMPRESA_ALIAS}-web"
        - "traefik.http.routers.plataforma-${EMPRESA_ALIAS}-web.middlewares=plataforma-${EMPRESA_ALIAS}-web-login"
        # Entrada pela raiz exata (sem caminho nem query) vai para o login da
        # empresa: https://<WEB_HOST>/ → /login?empresa=<EMPRESA_ALIAS>. O alias
        # diz à tela de login de qual empresa é o acesso (marca e empresa certas).
        # A navegação interna do Next (/?_rsc=...) não casa e passa direto.
        # No regex o `.` do domínio vale "qualquer caractere": inofensivo, porque só
        # chega aqui quem já casou o Host acima. `$$` é o `$` literal, escapado da
        # interpolação do compose.
        - "traefik.http.middlewares.plataforma-${EMPRESA_ALIAS}-web-login.redirectregex.regex=^https?://${WEB_HOST}/?$$"
        - "traefik.http.middlewares.plataforma-${EMPRESA_ALIAS}-web-login.redirectregex.replacement=https://${WEB_HOST}/login?empresa=${EMPRESA_ALIAS}"
        - "traefik.http.middlewares.plataforma-${EMPRESA_ALIAS}-web-login.redirectregex.permanent=false"
        - "traefik.http.services.plataforma-${EMPRESA_ALIAS}-web.loadbalancer.server.port=3000"

volumes:
  uploads:

networks:
  RCGNet:
    external: true
