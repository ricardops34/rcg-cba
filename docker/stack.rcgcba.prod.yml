# Stack de produção/teste na VPS — imagens buildadas e publicadas manualmente
# no Docker Hub via publish.ps1 (raiz do repo). Sem bind mount: o código está
# dentro da imagem; deploy = rodar publish.ps1 + redeploy no Portainer.
#
# Os valores de DATABASE_URL/JWT_*/etc. NÃO ficam neste arquivo: são definidos
# como variáveis de ambiente do stack no Portainer (Stacks → rcgcba → Env).
version: "3.8"

services:
  api:
    image: bjsoftware/rcgcba-api:latest
    environment:
      # O JWT inclui permissões; perfis amplos precisam de mais espaço no Authorization.
      NODE_OPTIONS: "--max-http-header-size=65536"
      # Runtime: plataforma_app. Migrations do boot: a role dona, à parte.
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      PORTAL_JWT_ACCESS_SECRET: ${PORTAL_JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN}
      AGENTE_IA_CRYPTO_KEY: ${AGENTE_IA_CRYPTO_KEY}
      # Cifra os segredos do WhatsApp gravados no banco: a chave da Evolution
      # GO, o token de cada instância e o segredo do webhook. Chave própria, e
      # não a do agente de IA — donos e ciclos de rotação diferentes.
      # Trocá-la exige regravar a chave pela tela e reconectar as instâncias.
      WHATSAPP_CRYPTO_KEY: ${WHATSAPP_CRYPTO_KEY}
      # Cifra os parâmetros de tipo senha (SMTP_SENHA, SMS_TOKEN). Chave
      # própria. Sem ela, salvar a senha do e-mail ou o token do SMS é
      # recusado; trocá-la exige regravar os dois pelas telas.
      PARAMETROS_CRYPTO_KEY: ${PARAMETROS_CRYPTO_KEY}
      # Endereço com que a Evolution GO chama a API de volta.
      # Se a Evolution GO estiver externa (outra VPS / nuvem): https://api.rcgdist.com.br
      # Se estiver na mesma VPS/rede Docker: http://rcgcba-api:3001
      WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL: ${WHATSAPP_EVOLUTION_WEBHOOK_BASE_URL:-https://api.rcgdist.com.br}
      # Armazenamento de arquivos no MinIO (docs/planos/2026-10-13-armazenamento-arquivos-minio.md).
      # Vazias = tudo em disco, no volume uploads, como antes. As pastas listadas em
      # ARMAZENAMENTO_S3_PASTAS (ex.: whatsapp) passam a gravar no bucket; o que ainda
      # está em disco continua servido até ser copiado (Plataforma → Armazenamento).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ENDPOINT_PUBLICO: ${S3_ENDPOINT_PUBLICO:-}
      S3_REGIAO: ${S3_REGIAO:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      ARMAZENAMENTO_S3_PASTAS: ${ARMAZENAMENTO_S3_PASTAS:-}
    volumes:
      # Uploads (logos de empresa) persistem fora do container.
      - uploads:/app/apps/api/uploads
    networks:
      RCGNet:
        aliases:
          - rcgcba-api
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=RCGNet"
        - "traefik.http.routers.plataforma-rcg-api.rule=Host(`api.rcgdist.com.br`)"
        - "traefik.http.routers.plataforma-rcg-api.entrypoints=websecure"
        - "traefik.http.routers.plataforma-rcg-api.tls=true"
        - "traefik.http.routers.plataforma-rcg-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-rcg-api.service=plataforma-rcg-api"
        - "traefik.http.services.plataforma-rcg-api.loadbalancer.server.port=3001"
        # A API também responde no domínio de cada cliente, só em /api e /uploads:
        # o front chama `/api/v1` no mesmo endereço em que o usuário abriu o
        # sistema (imagem única, sem endereço de API gravado no build), e o
        # cookie de sessão fica "da casa" em todos os domínios. Um roteador por
        # domínio, pelo mesmo motivo dos do web: um certificado por roteador.
        # `priority` explícita: o web responde ao mesmo Host, e a regra com
        # caminho precisa ganhar dele. CLIENTE NOVO = repetir este bloco com o
        # domínio dele (mais o do web, abaixo). O `api.rcgdist.com.br` acima
        # continua valendo: webhooks (Evolution GO) e quem integra por ele.
        - "traefik.http.routers.plataforma-rcg-crm-api.rule=Host(`crm.rcgdist.com.br`) && (PathPrefix(`/api/`) || PathPrefix(`/uploads/`))"
        - "traefik.http.routers.plataforma-rcg-crm-api.priority=100"
        - "traefik.http.routers.plataforma-rcg-crm-api.entrypoints=websecure"
        - "traefik.http.routers.plataforma-rcg-crm-api.tls=true"
        - "traefik.http.routers.plataforma-rcg-crm-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-rcg-crm-api.service=plataforma-rcg-api"
        - "traefik.http.routers.plataforma-cba-crm-api.rule=Host(`crm.cbadist.com.br`) && (PathPrefix(`/api/`) || PathPrefix(`/uploads/`))"
        - "traefik.http.routers.plataforma-cba-crm-api.priority=100"
        - "traefik.http.routers.plataforma-cba-crm-api.entrypoints=websecure"
        - "traefik.http.routers.plataforma-cba-crm-api.tls=true"
        - "traefik.http.routers.plataforma-cba-crm-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-cba-crm-api.service=plataforma-rcg-api"


  web:
    image: bjsoftware/rcgcba-web:latest
    networks:
      RCGNet:
        aliases:
          - rcgcba-web
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=RCGNet"
        # Um só serviço atende as duas marcas; a empresa vem do domínio.
        # Um roteador por domínio, e não `Host(a) || Host(b)` num só: o
        # Traefik pede um certificado por roteador com todos os hosts da
        # regra, e se o DNS de um deles ainda não aponta para a VPS o Let's
        # Encrypt recusa o pedido inteiro — os dois domínios ficavam com o
        # certificado padrão do Traefik ("Não seguro").
        - "traefik.http.routers.plataforma-rcg-web.rule=Host(`crm.rcgdist.com.br`)"
        - "traefik.http.routers.plataforma-rcg-web.entrypoints=websecure"
        - "traefik.http.routers.plataforma-rcg-web.tls=true"
        - "traefik.http.routers.plataforma-rcg-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-rcg-web.service=plataforma-rcg-web"
        - "traefik.http.routers.plataforma-rcg-web.middlewares=plataforma-rcg-web-login"
        - "traefik.http.routers.plataforma-cba-web.rule=Host(`crm.cbadist.com.br`)"
        - "traefik.http.routers.plataforma-cba-web.entrypoints=websecure"
        - "traefik.http.routers.plataforma-cba-web.tls=true"
        - "traefik.http.routers.plataforma-cba-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.plataforma-cba-web.service=plataforma-rcg-web"
        - "traefik.http.routers.plataforma-cba-web.middlewares=plataforma-rcg-web-login"
        # Entrada pela raiz exata (sem caminho nem query) vai para o login da
        # empresa do domínio: crm.rcgdist → ?empresa=rcg, crm.cbadist → ?empresa=cba.
        # A navegação interna do Next (/?_rsc=...) não casa e passa direto.
        # `$$` é o `$` literal, escapado da interpolação do compose.
        - "traefik.http.middlewares.plataforma-rcg-web-login.redirectregex.regex=^https?://crm\\.(rcg|cba)dist\\.com\\.br/?$$"
        - "traefik.http.middlewares.plataforma-rcg-web-login.redirectregex.replacement=https://crm.$${1}dist.com.br/login?empresa=$${1}"
        - "traefik.http.middlewares.plataforma-rcg-web-login.redirectregex.permanent=false"
        - "traefik.http.services.plataforma-rcg-web.loadbalancer.server.port=3000"

volumes:
  uploads:

networks:
  RCGNet:
    external: true
